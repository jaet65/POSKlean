name: Build and Release (Electron & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej: 0.0.3, omitir para usar tag o package.json)'
        required: false
        type: string
      create_release:
        description: 'Crear GitHub Release con los instaladores'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-electron:
    name: Build Windows (.exe)
    runs-on: windows-latest
    environment: .env.production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version from git tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Sincronizando versión de package.json a $VERSION (desde git tag)..."
            npm --no-git-tag-version version "$VERSION" --allow-same-version
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            echo "Sincronizando versión de package.json a $VERSION (desde input manual)..."
            npm --no-git-tag-version version "$VERSION" --allow-same-version
          fi

      - name: Create environment file
        shell: bash
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env.production
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env.production
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env.production
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env.production
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.production
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env.production

      - name: Build Electron installer
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: posklean-windows-installer
          path: dist/*.exe
          if-no-files-found: error

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    environment: .env.production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Set version from git tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Sincronizando versión a $VERSION..."
            npm --no-git-tag-version version "$VERSION" --allow-same-version
            sed -i "s/versionName \".*\"/versionName \"$VERSION\"/g" android/app/build.gradle
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            echo "Sincronizando versión a $VERSION..."
            npm --no-git-tag-version version "$VERSION" --allow-same-version
            sed -i "s/versionName \".*\"/versionName \"$VERSION\"/g" android/app/build.gradle
          fi

      - name: Create environment file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env.production
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env.production
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env.production
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env.production
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.production
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env.production

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for release
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            cp android/app/build/outputs/apk/debug/app-debug.apk "POSKlean-Android-v${VERSION}.apk"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            cp android/app/build/outputs/apk/debug/app-debug.apk "POSKlean-Android-v${VERSION}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk POSKlean-Android.apk
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: posklean-android-apk
          path: POSKlean-*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-electron, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || (inputs.version && format('v{0}', inputs.version)) || 'v0.0.2' }}
          name: Release ${{ github.ref_name || (inputs.version && format('v{0}', inputs.version)) || 'v0.0.2' }}
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
