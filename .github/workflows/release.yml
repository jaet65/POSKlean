name: Release (Electron, Android & Hosting)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej: 0.0.3, omitir para usar tag o package.json)'
        required: false
        type: string
      create_release:
        description: 'Crear GitHub Release con los instaladores'
        required: false
        type: boolean
        default: true
      deploy_hosting:
        description: 'Publicar versión web en Firebase Hosting (live)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  checks: write

jobs:
  get-version:
    name: Resolver Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: version_step
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
          else
            VER=$(node -p "require('./package.json').version")
          fi
          echo "Resolved version: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  build-electron:
    name: Build Windows (.exe)
    needs: get-version
    runs-on: windows-latest
    environment: .env.production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          echo "Sincronizando versión de package.json a $VERSION..."
          npm --no-git-tag-version version "$VERSION" --allow-same-version

      - name: Create environment file
        shell: bash
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env.production
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env.production
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env.production
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env.production
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.production
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env.production
          echo "VITE_GITHUB_READ_TOKEN=${{ secrets.VITE_GITHUB_READ_TOKEN }}" >> .env.production

      - name: Build Electron installer
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_READ_TOKEN: ${{ secrets.VITE_GITHUB_READ_TOKEN }}
          VITE_IS_RELEASE: 'true'
          APP_VERSION: ${{ needs.get-version.outputs.version }}

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: posklean-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-android:
    name: Build Android (.apk)
    needs: get-version
    runs-on: ubuntu-latest
    environment: .env.production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          echo "Sincronizando versión a $VERSION..."
          npm --no-git-tag-version version "$VERSION" --allow-same-version
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/g" android/app/build.gradle

      - name: Create environment file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env.production
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env.production
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env.production
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env.production
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.production
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env.production
          echo "VITE_GITHUB_READ_TOKEN=${{ secrets.VITE_GITHUB_READ_TOKEN }}" >> .env.production

      - name: Build web assets
        run: npm run build
        env:
          VITE_IS_RELEASE: 'true'
          VITE_GITHUB_READ_TOKEN: ${{ secrets.VITE_GITHUB_READ_TOKEN }}
          APP_VERSION: ${{ needs.get-version.outputs.version }}

      - name: Sync Capacitor Android
        run: |
          node -e "const fs = require('fs'); const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8')); delete cfg.server; fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));"
          npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for release
        shell: bash
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "POSKlean-Android-v${VERSION}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: posklean-android-apk
          path: POSKlean-*.apk
          if-no-files-found: error

  deploy-hosting:
    name: Deploy Firebase Hosting (Live)
    needs: get-version
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy_hosting)
    runs-on: ubuntu-latest
    environment: .env.production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          echo "Sincronizando versión de package.json a $VERSION..."
          npm --no-git-tag-version version "$VERSION" --allow-same-version

      - name: Create environment variables file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env.production
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env.production
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env.production
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env.production
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.production
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env.production

      - name: Build web app
        run: npm run build
        env:
          VITE_IS_RELEASE: 'true'
          APP_VERSION: ${{ needs.get-version.outputs.version }}

      - name: Deploy to Firebase Hosting (Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POSKLEAN }}
          channelId: live
          projectId: posklean

  publish-release:
    name: Publish GitHub Release
    needs: [get-version, build-electron, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: Release v${{ needs.get-version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.blockmap
            release-assets/**/latest.yml
            release-assets/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
